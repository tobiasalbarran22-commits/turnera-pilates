# Blueprint de Render: describe el servicio para que, al conectar este
# repo en Render, la mayoría de la configuración se complete sola (en
# vez de tener que cargar cada campo a mano desde el dashboard).
# Ver el README para el paso a paso de cómo usarlo.
services:
  - type: web
    name: turnera-pilates
    env: python
    plan: starter
    # OJO: el disco persistente (más abajo) solo está disponible en
    # tiempo de EJECUCIÓN, no durante el build - por eso seed.py
    # (que crea las tablas/usuario admin la primera vez) se corre acá,
    # no en buildCommand. Se puede correr en cada arranque sin miedo:
    # es idempotente, no borra ni duplica nada si ya existían datos.
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python seed.py && gunicorn run:app"
    disk:
      name: turnera-datos
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: MAIL_USUARIO
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      # La base SQLite pasa a vivir DENTRO del disco persistente de
      # arriba, en vez del filesystem normal del contenedor (que se
      # borra en cada redeploy/reinicio). Con 4 barras después de
      # "sqlite://": la ruta que sigue es absoluta (/var/data/...).
      - key: DATABASE_URL
        value: "sqlite:////var/data/turnera.db"
      # Token compartido para que el disparador del recordatorio
      # diario (el cron job de acá abajo) pueda autenticarse - sin
      # esto, cualquiera que encuentre la URL podría hacer que el
      # sistema mande recordatorios de más.
      - key: TAREAS_SECRETO
        sync: false
      # --- SEO ---
      # SITIO_URL: la dirección definitiva del sitio, sin barra final.
      # Mientras no haya dominio propio, dejarla VACÍA (la app arma las
      # URLs con el dominio por el que entró la visita, como siempre).
      # Apenas se compre el dominio, cargar acá el valor final (ej.
      # https://www.benincasapilates.com.ar): desde ese momento el
      # canonical, el sitemap y las previsualizaciones apuntan siempre
      # ahí, y el .onrender.com redirige con 301 en vez de competir
      # contra el dominio propio en Google.
      - key: SITIO_URL
        sync: false
      # Coordenadas exactas del estudio (Google Maps > click derecho
      # sobre el punto > copia "lat, long"). Pesan bastante para
      # aparecer en el mapa de "pilates cerca mío". Si quedan vacías,
      # el bloque simplemente no se publica - nunca se inventan.
      - key: ESTUDIO_LATITUD
        sync: false
      - key: ESTUDIO_LONGITUD
        sync: false
      # Horarios de atención reales. Formato:
      #   Monday,Tuesday,Wednesday,Thursday,Friday 08:00-21:00|Saturday 09:00-13:00
      - key: HORARIOS_ATENCION
        sync: false

  # Dispara una vez por día el recordatorio "mañana tenés clase" (ver
  # app/public/routes.py: tarea_recordatorios). Antes esto lo hacía
  # GitHub Actions llamando a la URL pública; ahora lo hace un cron
  # job de Render, que corre dentro de la misma cuenta/proyecto.
  - type: cron
    name: turnera-recordatorios
    env: python
    plan: starter
    schedule: "0 23 * * *" # 23:00 UTC = 20:00 hora Argentina, todos los días
    buildCommand: "echo 'sin build'"
    startCommand: >
      curl --fail --silent --show-error
      -X POST "https://turnera-pilates.onrender.com/tareas/recordatorios"
      -H "X-Tarea-Token: $TAREAS_SECRETO"
    envVars:
      # Mismo valor que el TAREAS_SECRETO del servicio web de arriba -
      # Render los pide por separado porque son servicios distintos.
      - key: TAREAS_SECRETO
        sync: false
