<section class="landing-seccion claro" id="ubicacion">
    <div class="envoltura">
        <div class="cabecera reveal">
            <span class="eyebrow">Dónde estamos</span>
            <h2>Visitanos</h2>
            <p>{{ direccion }} — a metros del límite entre Villa Santa Rita y Monte Castro.</p>
        </div>
        <div class="landing-mapa reveal">
            <iframe
                src="{{ mapa_embed_url }}"
                width="100%" height="100%" style="border:0;"
                allowfullscreen loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"
                title="Ubicación de Benincasa Pilates en Google Maps">
            </iframe>
        </div>
        <div class="fila-botones" style="justify-content:center; margin-top:1.5rem;">
            <a href="{{ mapa_url }}" target="_blank" rel="noopener" class="boton-cta boton-cta-secundario-claro">Cómo llegar</a>
        </div>
    </div>
</section>
